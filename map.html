<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rail Baron map</title>
<style>
  :root {
    --bg: #12161c; --panel: #1a2029; --line: #2b3441; --text: #e6e9ee;
    --muted: #8f9bab; --dot: #d3d9e2; --city: #f4f1e6; --halo: #12161c; --gold: #f2c14e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, "Segoe UI", sans-serif; overflow: hidden;
  }
  #stage { flex: 1; min-width: 0; position: relative; }
  svg { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  svg.dragging { cursor: grabbing; }

  .track { stroke-width: 2.6; stroke-linecap: round; fill: none; transition: opacity .12s; }
  .hit { stroke: transparent; stroke-width: 9; stroke-linecap: round; fill: none; cursor: pointer; }
  .dot { fill: var(--dot); stroke: var(--bg); stroke-width: .7; transition: opacity .12s; }
  .city { fill: var(--city); stroke: var(--bg); stroke-width: 1.2; cursor: pointer; transition: opacity .12s; }
  .label {
    fill: var(--text); font-size: 11px; font-weight: 600; pointer-events: none;
    paint-order: stroke; stroke: var(--halo); stroke-width: 3.2px; stroke-linejoin: round;
    transition: opacity .12s;
  }
  svg.focus .track:not(.on) { opacity: .1; }
  svg.focus .track.on { stroke-width: 4; }
  svg.focus .dot { opacity: .25; }
  svg.focus .route { opacity: .3; }
  svg.focus .city:not(.on), svg.focus .label:not(.on) { opacity: .25; }

  #hint { position: absolute; left: 14px; bottom: 12px; color: var(--muted); font-size: 12px; pointer-events: none; }
  #tools { position: absolute; left: 14px; top: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
  #layout { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  #layout button {
    background: var(--panel); color: var(--muted); border: 0; padding: 5px 12px; font: inherit; cursor: pointer;
  }
  #layout button + button { border-left: 1px solid var(--line); }
  #layout button.on { background: var(--text); color: var(--bg); font-weight: 600; }
  #gLabels { transition: opacity .2s; }
  #reset {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer;
  }
  #reset:hover { border-color: var(--muted); }
  #tip {
    position: fixed; pointer-events: none; background: #0b0e12; border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 10px; max-width: 260px; font-size: 12px; z-index: 5;
    box-shadow: 0 4px 14px rgba(0,0,0,.45);
  }
  #tip b { font-size: 13px; }
  #tip .sub { color: var(--muted); }

  aside {
    width: 300px; flex: none; background: var(--panel); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  aside h1 { font-size: 15px; margin: 0; padding: 14px 16px 2px; }
  aside .sub { color: var(--muted); padding: 0 16px 10px; font-size: 12px; }
  #sort { display: flex; gap: 6px; padding: 0 16px 10px; }
  #sort button {
    flex: 1; background: none; color: var(--muted); border: 1px solid var(--line);
    border-radius: 5px; padding: 3px 0; font: inherit; font-size: 12px; cursor: pointer;
  }
  #sort button.on { color: var(--text); border-color: var(--muted); }
  #list { overflow-y: auto; flex: 1; border-top: 1px solid var(--line); }
  .row {
    display: grid; grid-template-columns: 14px 1fr auto; gap: 9px; align-items: center;
    padding: 5px 16px; cursor: pointer; border-left: 3px solid transparent;
  }
  .row:hover { background: #222a35; }
  .row.pinned { background: #263040; border-left-color: var(--text); }
  .swatch { width: 14px; height: 4px; border-radius: 2px; }
  .row .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .nm span { color: var(--muted); margin-left: 5px; font-size: 12px; }
  .row .val { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  #detail { border-top: 1px solid var(--line); padding: 12px 16px 14px; min-height: 150px; }
  #detail h2 { font-size: 14px; margin: 0 0 6px; display: flex; align-items: center; gap: 8px; }
  #detail dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0 0 8px; }
  #detail dt { color: var(--muted); }
  #detail dd { margin: 0; font-variant-numeric: tabular-nums; }
  #detail p { margin: 0; color: var(--muted); font-size: 12px; }

  #tabs { display: flex; gap: 6px; padding: 0 16px 12px; }
  #tabs button {
    flex: 1; background: none; color: var(--muted); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 0; font: inherit; font-weight: 600; cursor: pointer;
  }
  #tabs button.on { color: var(--bg); background: var(--text); border-color: var(--text); }
  .pane { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .pane[hidden] { display: none; }
  #paneDest { overflow-y: auto; padding: 12px 16px 16px; border-top: 1px solid var(--line); gap: 12px; }
  #where { color: var(--muted); }
  #where b { color: var(--text); }
  .btn {
    background: var(--gold); color: #1b1503; border: 0; border-radius: 6px; padding: 9px 0;
    font: inherit; font-weight: 700; cursor: pointer; width: 100%; flex: none;
  }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.quiet { background: none; color: var(--muted); border: 1px solid var(--line); font-weight: 500; padding: 5px 0; }
  .rollrow { display: grid; grid-template-columns: 46px auto 1fr; gap: 10px; align-items: center; min-height: 40px; }
  .rollrow .lbl { color: var(--muted); }
  .dice { display: flex; gap: 5px; }
  .die {
    width: 32px; height: 32px; border-radius: 6px; background: #f4f1e6; padding: 5px;
    display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); gap: 1px;
  }
  .die i { border-radius: 50%; }
  .die i.p { background: #1b1f26; }
  .die.black { background: #05070a; box-shadow: inset 0 0 0 1px #5d6978; }
  .die.black i.p { background: #f4f1e6; }
  .die.blank { background: none; box-shadow: inset 0 0 0 1px var(--line); }
  #picker { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #picker[hidden] { display: none; }
  #picker p { grid-column: 1 / -1; margin: 0; }
  #picker button {
    background: #222a35; color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 8px; font: inherit; cursor: pointer; text-align: left;
  }
  #picker button:hover { border-color: var(--gold); }
  #picker button span { display: block; color: var(--muted); font-size: 11px; }
  #picker button.best { border-color: var(--gold); }
  #result { background: #10141a; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; min-height: 62px; }
  #result .big { font-size: 15px; font-weight: 700; }
  #result .pay { color: var(--gold); font-weight: 700; }
  #result .sub { padding: 0; }
  #totals { display: flex; justify-content: space-between; color: var(--muted); }
  #totals b { color: var(--text); font-variant-numeric: tabular-nums; }
  #log { font-size: 12px; color: var(--muted); display: grid; gap: 3px; }
  #log div { display: flex; justify-content: space-between; gap: 8px; }
  #log div span:last-child { font-variant-numeric: tabular-nums; color: var(--text); }
  .route { fill: none; stroke: #fff; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; opacity: .85; pointer-events: none; }
  .ring { fill: none; stroke-width: 2.6; pointer-events: none; }
  .ring.from { stroke: var(--muted); }
  .ring.to { stroke: var(--gold); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { stroke-opacity: .25; } }

  #paneGame { overflow-y: auto; padding: 12px 16px 16px; border-top: 1px solid var(--line); gap: 12px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; flex: none; }
  .seg button {
    flex: 1; background: none; color: var(--muted); border: 0; padding: 5px 0; font: inherit; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--text); color: var(--bg); font-weight: 600; }
  .seg button:disabled { opacity: .4; cursor: default; }
  #gPlay.seg-main { flex: 1.6; color: #1b1503; background: var(--gold); font-weight: 700; }
  #gSeek { width: 100%; margin: 0; accent-color: var(--gold); flex: none; }
  #gWhen { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: -8px; }
  #gTurn { background: #10141a; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; min-height: 190px; flex: none; }
  #gScore, #gWhen { flex: none; }
  #gTurn .who { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  #gTurn .rollrow { grid-template-columns: 46px auto 1fr; font-size: 12px; }
  #gTurn .pay { color: var(--gold); font-weight: 700; }
  #gTurn .note { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .chip {
    width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; flex: none;
    font-size: 11px; font-weight: 700; color: #10141a; box-shadow: 0 0 0 1.5px #fff;
  }
  #gScore { display: grid; gap: 4px; }
  .prow {
    display: grid; grid-template-columns: 18px 1fr auto; gap: 2px 10px; align-items: center;
    padding: 6px 8px; border-radius: 6px; border: 1px solid transparent;
  }
  .prow.turn { background: #222a35; border-color: var(--line); }
  .prow .cash { font-variant-numeric: tabular-nums; font-weight: 600; }
  .prow > span:nth-child(2) { display: flex; flex-wrap: wrap; align-items: center; row-gap: 2px; white-space: nowrap; }
  .prow .going { grid-column: 2 / -1; color: var(--muted); font-size: 12px; }
  .prow .bar { grid-column: 2 / -1; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .prow .bar i { display: block; height: 100%; }
  #gTurn .line { margin: 3px 0; }
  #gTurn .line .sub { padding: 0; font-size: 12px; }
  #gTurn .die { width: 26px; height: 26px; padding: 4px; border-radius: 5px; }
  #gTurn .die.color { background: #c0392b; }
  #gTurn .die.color i.p { background: #fff; }
  .badge { font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 8px; margin-left: 6px;
           background: var(--line); color: var(--text); vertical-align: 1px; }
  .badge.gold { background: var(--gold); color: #1b1503; }
  .prow.gone { opacity: .45; }
  .prow .owns { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 3px; }
  .prow .owns span { font-size: 10px; padding: 0 5px; border-radius: 3px; border: 1px solid; }
  .token { stroke: #fff; stroke-width: 1.6; }
  .tokenText { font-size: 11.5px; font-weight: 700; fill: #10141a; text-anchor: middle; pointer-events: none; }
  .goal { fill: none; stroke-width: 2.4; stroke-dasharray: 4 3; pointer-events: none; }
  .ahead { fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; opacity: .55; pointer-events: none; }

  @media (max-width: 760px) {
    body { flex-direction: column; }
    aside { width: 100%; height: 45%; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="stage">
  <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="tools">
    <button id="reset">Reset view</button>
    <div id="layout">
      <button data-layout="geo" class="on">Geographic</button>
      <button data-layout="even">Even spacing</button>
    </div>
  </div>
  <div id="hint">Scroll to zoom, drag to pan. Hover a line or city for details. Click to pin a railroad.</div>
</div>
<aside>
  <h1>Rail Baron</h1>
  <div class="sub" id="counts"></div>
  <div id="tabs">
    <button data-pane="paneRR" class="on">Railroads</button>
    <button data-pane="paneDest">Destinations</button>
    <button data-pane="paneGame">Game</button>
  </div>
  <div class="pane" id="paneRR">
  <div id="sort">
    <button data-key="price" class="on">Price</button>
    <button data-key="coverage">Coverage</button>
    <button data-key="traffic_share">Traffic</button>
    <button data-key="id">Name</button>
  </div>
  <div id="list"></div>
  <div id="detail"></div>
  </div>
  <div class="pane" id="paneDest" hidden>
    <div id="where"></div>
    <button class="btn" id="roll">Roll destination</button>
    <div>
      <div class="rollrow"><span class="lbl">Region</span><span class="dice" id="dice1"></span><span id="res1"></span></div>
      <div class="rollrow"><span class="lbl">City</span><span class="dice" id="dice2"></span><span id="res2"></span></div>
    </div>
    <div id="picker" hidden></div>
    <div id="result"></div>
    <div id="totals"></div>
    <div id="log"></div>
    <button class="btn quiet" id="restart">Start over</button>
  </div>
  <div class="pane" id="paneGame" hidden>
    <div class="seg" id="gPick"></div>
    <div class="seg">
      <button id="gRestart">Restart</button>
      <button id="gBack">Back</button>
      <button id="gPlay" class="seg-main">Play</button>
      <button id="gStep">Step</button>
    </div>
    <div class="seg" id="gSpeed">
      <button data-speed="0.5">Slow</button>
      <button data-speed="1" class="on">Normal</button>
      <button data-speed="4">Fast</button>
      <button data-speed="20">Fastest</button>
    </div>
    <div class="seg" id="gPaint">
      <button data-paint="owner" class="on">Track by owner</button>
      <button data-paint="line">Track by railroad</button>
    </div>
    <input type="range" id="gSeek" min="0" value="0">
    <div id="gWhen"></div>
    <div id="gTurn"></div>
    <div id="gScore"></div>
    <div class="sub" style="padding:0">This is a recording of a game played by the Python engine. Run
      <b>python -m railbaron.game</b> for a new one.</div>
  </div>
</aside>
<div id="tip" hidden></div>

const el = (name, attrs, parent) => {

// Two ways to lay the board out. P holds wherever the dots are right now.
const EVEN_SCALE = 27;        // drawing units per piece of track in the even layout
const LAYOUTS = { geo: {}, even: {} };
for (const [id, n] of Object.entries(DATA.nodes)) {
  LAYOUTS.geo[id] = { x: n.x * SCALE, y: n.y * SCALE };
  LAYOUTS.even[id] = { x: n.ex * EVEN_SCALE, y: n.ey * EVEN_SCALE };

const CITY_R = 4.4;
const trackEls = [], dotEls = [];
for (const seg of DATA.segments) seg.railroads.forEach((rr, i) => trackEls.push({
  seg,
  // Parallel railroads are drawn side by side so each stays visible.
  off: (i - (seg.railroads.length - 1) / 2) * GAP,
  lines: [el("line", { class: "track", stroke: RR[rr].color, "data-rr": rr }, gTracks),
          el("line", { class: "hit", "data-rr": rr }, gHits)],
}));

  if (!cityAt[id]) dotEls.push({ id, node: el("circle", { r: 2.1, class: "dot" }, gDots) });

  dotEls.push({ id: c.node, node: el("circle", { r: CITY_R, class: "city", "data-city": c.name }, gDots) });

function updateGeometry() {
  for (const t of trackEls) {
    const a = P[t.seg.a], b = P[t.seg.b];
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
    const ox = -dy / len * t.off, oy = dx / len * t.off;
    for (const line of t.lines) {
      line.setAttribute("x1", a.x + ox); line.setAttribute("y1", a.y + oy);
      line.setAttribute("x2", b.x + ox); line.setAttribute("y2", b.y + oy);
    }
  }
  for (const d of dotEls) { d.node.setAttribute("cx", P[d.id].x); d.node.setAttribute("cy", P[d.id].y); }
}

// Place each label where it overlaps other labels, cities and track least.
function placeLabels() {
  gLabels.innerHTML = "";
  const FS = 11, H = FS * 1.05, pad = CITY_R + 2.5;
  const boxes = DATA.cities.map(c => {
    const p = P[c.node];
    return { x: p.x - CITY_R, y: p.y - CITY_R, w: 2 * CITY_R, h: 2 * CITY_R };
  });
  const trackPts = [];
  for (const seg of DATA.segments) {
    const a = P[seg.a], b = P[seg.b];
    for (let t = 0; t <= 1; t += 0.25) trackPts.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
  }
  const overlap = (p, q) => Math.max(0, Math.min(p.x + p.w, q.x + q.w) - Math.max(p.x, q.x)) *
                            Math.max(0, Math.min(p.y + p.h, q.y + q.h) - Math.max(p.y, q.y));
  for (const c of DATA.cities) {
    const p = P[c.node], w = c.name.length * FS * 0.56;
    const spots = [
      { x: p.x + pad, y: p.y - H / 2, anchor: "start" },
      { x: p.x - pad - w, y: p.y - H / 2, anchor: "end" },
      { x: p.x - w / 2, y: p.y - pad - H, anchor: "middle" },
      { x: p.x - w / 2, y: p.y + pad, anchor: "middle" },
      { x: p.x + pad * 0.7, y: p.y - pad * 0.7 - H, anchor: "start" },
      { x: p.x + pad * 0.7, y: p.y + pad * 0.7, anchor: "start" },
      { x: p.x - pad * 0.7 - w, y: p.y - pad * 0.7 - H, anchor: "end" },
      { x: p.x - pad * 0.7 - w, y: p.y + pad * 0.7, anchor: "end" },
    ];
    let best = null;
    spots.forEach((s, i) => {
      const box = { x: s.x, y: s.y, w, h: H };
      let score = i * 2;
      for (const b of boxes) score += overlap(box, b) * 4;
      for (const t of trackPts)
        if (t.x > box.x && t.x < box.x + w && t.y > box.y && t.y < box.y + H) score += 14;
      if (!best || score < best.score) best = { score, box, s };
    });
    boxes.push(best.box);
    const tx = best.s.anchor === "start" ? best.box.x : best.s.anchor === "end" ? best.box.x + w : best.box.x + w / 2;
    el("text", { x: tx, y: best.box.y + H * 0.8, class: "label", "text-anchor": best.s.anchor,
                 "data-city": c.name }, gLabels).textContent = c.name;
  }
}

  const f = Math.exp(e.deltaY * 0.0015), w = Math.min(HOME.w * 1.5, Math.max(HOME.w / 14, view.w * f));
  const k = w / view.w, p = toBoard(e);
  view = { x: p.x - (p.x - view.x) * k, y: p.y - (p.y - view.y) * k, w, h: view.h * k };
  applyView();
}, { passive: false });
let drag = null, moved = false;

  if (!drag) return;

  if (Math.hypot(p.x - drag.x, p.y - drag.y) * svg.clientWidth / view.w > 3) moved = true;
  if (!moved) return;

// Same tables and same dice-to-outcome rule as railbaron/destinations.py.
const D = DATA.destinations;
const outcome = (black, w1, w2) => (black % 2 === 0 ? 36 : 0) + (w1 - 1) * 6 + (w2 - 1);
const d6 = () => 1 + Math.floor(Math.random() * 6);
const throwDice = () => [d6(), d6(), d6()];        // black, white, white
const sleep = ms => new Promise(r => setTimeout(r, ms));
const $ = id => document.getElementById(id);
const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
const dieHTML = (face, black) => `<span class="die${black ? " black" : ""}${face ? "" : " blank"}">` +
  Array.from({ length: 9 }, (_, i) => `<i class="${face && PIPS[face].includes(i) ? "p" : ""}"></i>`).join("") + "</span>";
const showDice = (box, f) => { box.innerHTML = dieHTML(f[0], true) + dieHTML(f[1]) + dieHTML(f[2]); };
const readDice = f => `${f[0] % 2 ? "odd" : "even"} ${f[1] + f[2]}`;

const NEXT = {};
for (const s of DATA.segments) { (NEXT[s.a] ||= []).push(s.b); (NEXT[s.b] ||= []).push(s.a); }
function shortestPath(a, b) {
  const prev = { [a]: null }, queue = [a];
  for (let i = 0; i < queue.length && !(b in prev); i++)
    for (const v of NEXT[queue[i]]) if (!(v in prev)) { prev[v] = queue[i]; queue.push(v); }
  const path = [];
  for (let n = b; n != null; n = prev[n]) path.unshift(n);
  return path;
}
// Average payoff from city `from` if the destination lands in `region`.
function regionValue(from, region) {
  let sum = 0, n = 0;
  for (const c of D.city_table[region]) if (D.nodes[c] !== D.nodes[from]) { sum += D.payoff[from][c]; n++; }
  return sum / n;
}
function payoffLines(node) {
  if (game.here == null || D.nodes[game.here] === node) return "";
  return D.names.map((name, c) => D.nodes[c] === node
    ? `<div>${esc(name)} pays ${money(D.payoff[game.here][c])} from ${esc(D.names[game.here])}</div>` : "").join("");
}

const game = { here: null, from: null, trips: 0, total: 0, busy: false, log: [] };
async function animate(box, final, on) {
  if (on) for (let i = 0; i < 7; i++) { showDice(box, throwDice()); await sleep(55); }
  showDice(box, final);
}
function chooseRegion(rolled) {
  const picker = $("picker"), best = D.richest[game.here];
  picker.innerHTML = `<p>You rolled your own region, ${REGION[D.regions[rolled]]}. Choose any region.</p>` +
    D.regions.map((code, r) => `<button data-r="${r}" class="${r === best ? "best" : ""}">${REGION[code]}
      <span>average ${money(Math.round(regionValue(game.here, r)))}</span></button>`).join("");
  picker.hidden = false;
  return new Promise(done => picker.querySelectorAll("button").forEach(b => b.onclick = () => {
    picker.hidden = true; done(+b.dataset.r);
  }));
}
// pick: chooses the region when the player's own region is rolled.
async function rollDestination(animated = true, pick = chooseRegion) {
  if (game.busy) return;
  game.busy = true; $("roll").disabled = true;
  $("res1").textContent = $("res2").textContent = ""; showDice($("dice2"), [0, 0, 0]);

  let dice = throwDice();
  await animate($("dice1"), dice, animated);
  let region = D.region_table[outcome(...dice)];
  $("res1").textContent = `${readDice(dice)}: ${REGION[D.regions[region]]}`;
  if (game.here != null && region === D.region[game.here]) {
    region = await pick(region);
    $("res1").textContent += region === D.region[game.here] ? ", kept" : `, chose ${REGION[D.regions[region]]}`;
  }

  dice = throwDice();
  await animate($("dice2"), dice, animated);
  const city = D.city_table[region][outcome(...dice)];
  $("res2").textContent = `${readDice(dice)}: ${D.names[city]}`;

  if (game.here != null && D.nodes[city] === D.nodes[game.here]) {
    // The rulebook: already in the city you roll, you lose the turn.
    $("result").innerHTML = `<div class="big">Already in ${esc(D.names[city])}</div><div class="sub">That loses the turn. Roll again next turn.</div>`;
    game.busy = false; $("roll").disabled = false;
    return;
  }
  if (game.here == null) {
    $("result").innerHTML = `<div class="big">Home city: ${esc(D.names[city])}</div><div class="sub">Roll again for a first destination.</div>`;
  } else {
    const pay = D.payoff[game.here][city], dots = shortestPath(D.nodes[game.here], D.nodes[city]).length - 1;
    game.trips++; game.total += pay;
    game.log.unshift([`${D.names[game.here]} to ${D.names[city]}`, pay]);
    $("result").innerHTML = `<div class="big">${esc(D.names[game.here])} to ${esc(D.names[city])}</div>
      <div>Pays <span class="pay">${money(pay)}</span>, ${dots} dots by the shortest route</div>`;
  }
  game.from = game.here; game.here = city;
  drawGame();
  game.busy = false; $("roll").disabled = false;
}
function drawGame() {
  gOverlay.innerHTML = gRings.innerHTML = "";
  const ring = (c, cls) => { const p = P[D.nodes[c]]; el("circle", { cx: p.x, cy: p.y, r: CITY_R + 4.5, class: "ring " + cls }, gRings); };
  if (game.from != null) {
    const pts = shortestPath(D.nodes[game.from], D.nodes[game.here]).map(n => `${P[n].x},${P[n].y}`).join(" ");
    el("polyline", { points: pts, class: "route" }, gOverlay);
    ring(game.from, "from");
  }
  if (game.here != null) ring(game.here, "to");
  $("where").innerHTML = game.here == null ? "No home city yet. The first roll picks it."
    : `Destination: <b>${esc(D.names[game.here])}</b>. The next roll starts from there.`;
  $("totals").innerHTML = `<span>Trips <b>${game.trips}</b></span><span>Total <b>${money(game.total)}</b></span>
    <span>Average <b>${game.trips ? money(Math.round(game.total / game.trips)) : "$0"}</b></span>`;
  $("log").innerHTML = game.log.slice(0, 12).map(([t, pay]) => `<div><span>${esc(t)}</span><span>${money(pay)}</span></div>`).join("");
}

// --------------------------------------------------------------- game replay
// The Python engine played these games and wrote down every roll, move,
// purchase and payment. This section only replays them. It applies no rules.
const GAMES = DATA.games || [];
const PCOLOR = ["#ff6b6b", "#4dabf7", "#ffd43b", "#69db7c", "#c692ff", "#ffa94d"];
const BANK_COLOR = "#4a5565";
const gPlayLayer = el("g", {}, svg);
const faces3 = k => [Math.floor(k / 36) + 1, Math.floor(k / 6) % 6 + 1, k % 6 + 1];
let G = null, STATES = [], gPos = 0, gRun = 0, gPlaying = false, gSpeed = 1, gPaint = "owner", painted = "";
const chip = i => `<span class="chip" style="background:${PCOLOR[i]}">${i + 1}</span>`;
const pname = i => esc(G.players[i].name);
const rrName = r => esc(DATA.railroads[r].name);

const cloneState = st => ({ players: st.players.map(p => ({ ...p })), owner: st.owner.slice(), winner: st.winner });
// Apply one recorded event to a state. i is the player whose turn it is.
function applyEvent(st, i, e) {
  if (e.t === "caught") {             // the rover play: e.by catches declared player e.p
    st.players[e.p].cash -= e.pay; st.players[e.by].cash += e.pay; st.players[e.p].declared = false;
    return;
  }
  if (e.p != null && e.t !== "undeclare" && e.t !== "win") i = e.p;    // some events belong to another player
  const p = st.players[i];
  if (e.t === "dest") { if (!e.lost) { p.dest = e.city; p.declared = e.declared; } }
  else if (e.t === "route" || e.t === "rover") { p.route = e.nodes; p.rrs = e.rrs; p.step = 0; }
  else if (e.t === "move") p.step = e.to;
  else if (e.t === "arrive") { p.city = e.city; p.dest = null; p.declared = false; p.trips++; p.cash += e.pay; }
  else if (e.t === "buy") {
    p.cash -= e.price;
    if (e.item === "line") st.owner[e.rr] = i; else p[e.item] = true;
  } else if (e.t === "sale") {
    st.owner[e.rr] = e.to; p.cash += e.price;
    if (e.to >= 0) st.players[e.to].cash -= e.price;
  } else if (e.t === "fees") {
    p.cash -= e.bank;
    for (const [o, amount] of e.to) { p.cash -= amount; st.players[o].cash += amount; }
  } else if (e.t === "out") { p.out = true; p.dest = null; }
  else if (e.t === "undeclare") st.players[e.p].declared = false;
  else if (e.t === "win") st.winner = e.p ?? i;
}
// The state after every turn, worked out once when a game is picked.
function buildStates() {
  let st = { winner: null, owner: DATA.railroads.map(() => -1),
    players: G.players.map(p => ({ home: p.home, city: p.home, dest: null, declared: false,
      route: [D.nodes[p.home]], rrs: [], step: 0, cash: G.start_cash, trips: 0,
      express: false, superchief: false, out: false })) };
  STATES = [st];
  for (const turn of G.turns) {
    st = cloneState(st);
    for (const e of turn.ev) applyEvent(st, turn.p, e);
    turn.cash.forEach((c, i) => st.players[i].cash = c);     // the engine's figures are final
    STATES.push(st);
  }
}
function paintTracks(st) {
  const mode = st && !$("paneGame").hidden ? gPaint : "line";
  const key = mode === "owner" ? st.owner.join() : "line";
  if (key === painted) return;
  painted = key;
  for (const t of trackEls)
    t.lines[0].style.stroke = mode === "owner" ? (st.owner[t.rr] < 0 ? BANK_COLOR : PCOLOR[st.owner[t.rr]]) : "";
}
function drawPlay(st) {
  gPlayLayer.innerHTML = "";
  if (!G || $("paneGame").hidden) { paintTracks(null); return; }
  st = st || STATES[gPos];
  paintTracks(st);
  const last = gPos ? G.turns[gPos - 1].p : -1;
  st.players.forEach((p, i) => {
    if (p.dest == null || p.out) return;
    const goal = P[D.nodes[p.declared ? p.home : p.dest]];
    el("circle", { cx: goal.x, cy: goal.y, r: CITY_R + 4 + i * 2.4, class: "goal", stroke: PCOLOR[i] }, gPlayLayer);
    if (i === last && p.step < p.route.length - 1)
      el("polyline", { points: p.route.slice(p.step).map(n => `${P[n].x},${P[n].y}`).join(" "),
                       class: "ahead", stroke: PCOLOR[i] }, gPlayLayer);
  });
  const at = {};
  st.players.forEach((p, i) => { if (!p.out) (at[p.route[p.step]] ||= []).push(i); });
  for (const [node, who] of Object.entries(at)) who.forEach((i, j) => {
    // Players sharing a dot fan out around it.
    const a = 2 * Math.PI * j / who.length - Math.PI / 2, r = who.length > 1 ? 10 : 0;
    const x = P[node].x + Math.cos(a) * r, y = P[node].y + Math.sin(a) * r;
    el("circle", { cx: x, cy: y, r: 9, class: "token", fill: PCOLOR[i] }, gPlayLayer);
    el("text", { x, y: y + 4, class: "tokenText" }, gPlayLayer).textContent = i + 1;
  });
}
function diceRow(label, k, text) {
  const f = faces3(k);
  return `<div class="rollrow"><span class="lbl">${label}</span><span class="dice">${dieHTML(f[0], true)}${dieHTML(f[1])}${dieHTML(f[2])}</span>
    <span>${readDice(f)}: ${text}</span></div>`;
}
const line = (html, sub) => `<div class="line">${html}${sub ? `<div class="sub">${sub}</div>` : ""}</div>`;
// One turn, event by event, in words.
function describeTurn(k) {
  const turn = G.turns[k], i = turn.p, st = cloneState(STATES[k]), p = st.players[i];
  let html = `<div class="who">${chip(i)}${pname(i)}</div>`;
  for (const e of turn.ev) {
    if (e.t === "dest") {
      let region = REGION[D.regions[e.rolled]];
      if (e.rolled !== e.region) region += `. Own region, so takes ${REGION[D.regions[e.region]]}`;
      html += diceRow("Region", e.region_roll, region) + diceRow("City", e.city_roll, esc(D.names[e.city]));
      if (e.lost) html += line("Already there. Loses the turn.");
      if (e.declared) html += line(`<b>Declares.</b> Heads home to ${esc(D.names[p.home])}.`,
                                   `${esc(D.names[e.city])} is the alternate destination.`);
    } else if (e.t === "route") {
      const lines = [...new Set(e.rrs)].map(r => esc(DATA.railroads[r].id)).join(", ");
      const weighed = e.options && e.options.length > 1
        ? "Weighed: " + e.options.map(o => `${o.picked ? "<b>" : ""}${o.dots} dots, about ${money(o.fees)} in fees${o.picked ? "</b>" : ""}`).join(" or ")
        : "";
      const whose = e.p != null && e.p !== i ? `${pname(e.p)}'s new route` : "Route";
      html += line(`${whose}: ${e.rrs.length} dots on ${lines}`, weighed);
    } else if (e.t === "rover") {
      html += line(`<b>Rover play.</b> Turns aside to chase ${pname(e.target)}.`, `New route: ${e.rrs.length} dots`);
    } else if (e.t === "caught") {
      html += line(`<b>Catches ${pname(e.p)}</b> and collects <span class="pay">${money(e.pay)}</span>`,
                   `${pname(e.p)} is no longer declared and must go to the alternate destination.`);
    } else if (e.t === "move") {
      const left = p.route.length - 1 - e.to, roll = e.dice.reduce((a, c) => a + c, 0);
      const dice = e.bonus ? `<span class="die color">${dieHTML(e.dice[0]).slice(18)}` : dieHTML(e.dice[0]) + dieHTML(e.dice[1]);
      html += `<div class="rollrow"><span class="lbl">${e.bonus ? "Bonus" : "Move"}</span><span class="dice">${dice}</span>
        <span>${roll}: ${left ? `moves ${e.to - e.from}, ${left} to go` : "arrives"}</span></div>`;
    } else if (e.t === "arrive") {
      html += line(`Arrives in <b>${esc(D.names[e.city])}</b> from ${esc(D.names[e.from])}. Collects <span class="pay">${money(e.pay)}</span>`);
    } else if (e.t === "home") {
      html += line("Reaches the home city.");
    } else if (e.t === "buy") {
      const what = e.item === "line" ? rrName(e.rr) : e.item === "express" ? "an Express" : "a Superchief";
      const worth = e.considered && e.considered.length
        ? "Valued: " + e.considered.map(c => `${esc(DATA.railroads[c.rr].id)} ${money(c.value)}`).join(", ") : "";
      html += line(`Buys <b>${what}</b> for ${money(e.price)}`, worth);
    } else if (e.t === "sale") {
      const to = e.to < 0 ? "the bank" : pname(e.to);
      const bids = e.bids.length ? `${e.bids.length} bid${e.bids.length > 1 ? "s" : ""}, opening at ${money(e.bids[0][1])}` : "No bids";
      html += line(`Cannot pay. Sells <b>${rrName(e.rr)}</b> to ${to} for ${money(e.price)}`, e.auction ? bids : "");
    } else if (e.t === "fees") {
      const parts = [];
      if (e.bank) parts.push(`${money(e.bank)} to the bank`);
      for (const [o, amount] of e.to) parts.push(`${money(amount)} to ${pname(o)}`);
      html += line(`Pays ${parts.join(", ")}`);
    } else if (e.t === "out") {
      html += line("<b>Cannot pay and has nothing to sell. Out of the game.</b>");
    } else if (e.t === "undeclare") {
      // A caught player has already been reported on the line above.
      if (!turn.ev.some(c => c.t === "caught" && c.p === e.p))
        html += line(`${pname(e.p)} is below ${money(G.target_cash)}: no longer declared.`);
    } else if (e.t === "win") {
      html += line(`<b style="color:var(--gold)">${pname(e.p ?? i)} wins</b> (${e.how}).`);
    }
    applyEvent(st, i, e);
  }
  return html;
}
function drawGamePanel() {
  if (!G) { $("gTurn").innerHTML = "No recorded game. Run <b>python -m railbaron.game</b>."; return; }
  const n = G.players.length, st = STATES[gPos], total = G.turns.length;
  $("gSeek").max = total; $("gSeek").value = gPos;
  $("gWhen").innerHTML = `<span>Turn ${gPos} of ${total}</span><span>${st.owner.filter(o => o >= 0).length} of ${st.owner.length} railroads sold</span>`;
  $("gBack").disabled = $("gRestart").disabled = gPos === 0;
  $("gStep").disabled = gPos >= total;
  $("gPlay").textContent = gPlaying ? "Pause" : gPos >= total ? "Replay" : "Play";

  if (gPos === 0) {
    $("gTurn").innerHTML = `<div class="who">Home cities</div>` + G.players.map((p, i) =>
      `<div style="display:flex;gap:8px;align-items:center;margin:3px 0">${chip(i)}<span>${esc(p.name)} starts in <b>${esc(D.names[p.home])}</b></span></div>`).join("") +
      `<div class="note">Everyone starts with ${money(G.start_cash)}. To win, reach ${money(G.target_cash)} and get back home.</div>`;
  } else $("gTurn").innerHTML = describeTurn(gPos - 1);

  const next = gPos < total ? G.turns[gPos].p : -1;
  $("gScore").innerHTML = st.players.map((p, i) => {
    const going = p.out ? "Out of the game"
      : p.dest == null ? `In ${esc(D.names[p.city])}`
      : `${esc(D.names[p.city])} to ${esc(D.names[p.declared ? p.home : p.dest])}, ${p.route.length - 1 - p.step} dots to go`;
    const train = p.superchief ? '<span class="badge gold">Superchief</span>' : p.express ? '<span class="badge">Express</span>' : "";
    const flag = st.winner === i ? '<span class="badge gold">Winner</span>' : p.declared ? '<span class="badge gold">Declared</span>' : "";
    const owns = st.owner.map((o, r) => o === i ? `<span style="border-color:${PCOLOR[i]}" title="${rrName(r)}">${esc(DATA.railroads[r].id)}</span>` : "").join("");
    return `<div class="prow${i === next ? " turn" : ""}${p.out ? " gone" : ""}">${chip(i)}<span>${esc(G.players[i].name)}${train}${flag}</span>
      <span class="cash">${money(p.cash)}</span>
      <span class="going">${going}. ${p.trips} trip${p.trips === 1 ? "" : "s"}.</span>
      ${owns ? `<span class="owns">${owns}</span>` : ""}
      <span class="bar"><i style="width:${Math.min(100, 100 * p.cash / G.target_cash)}%;background:${PCOLOR[i]}"></i></span></div>`;
  }).join("");
}
function showGame() { drawGamePanel(); drawPlay(); }
async function advance(animated, run) {
  if (gPos >= G.turns.length) return false;
  const turn = G.turns[gPos], i = turn.p, st = cloneState(STATES[gPos]);
  gPos++;
  drawGamePanel();
  if (animated) {
    for (const e of turn.ev) {
      if (e.t === "move") {
        for (let s = e.from + 1; s <= e.to && run === gRun; s++) {
          st.players[i].step = s;
          drawPlay(st);
          await sleep(85 / gSpeed);
        }
      }
      applyEvent(st, i, e);
      if (["route", "rover", "caught", "buy", "sale"].includes(e.t)) { drawPlay(st); await sleep(350 / gSpeed); }
      if (run !== gRun) return false;
    }
  }
  drawPlay();
  return true;
}
function pauseGame() { gRun++; gPlaying = false; }
async function playGame() {
  if (gPos >= G.turns.length) gPos = 0;
  const run = ++gRun;
  gPlaying = true;
  showGame();
  while (run === gRun && await advance(true, run)) await sleep(380 / gSpeed);
  if (run === gRun) { gPlaying = false; showGame(); }
}
function seekGame(n) { pauseGame(); gPos = Math.max(0, Math.min(G.turns.length, n)); showGame(); }
function pickGame(i) {
  pauseGame();
  G = GAMES[i]; gPos = 0;
  buildStates();
  document.querySelectorAll("#gPick button").forEach((b, j) => b.classList.toggle("on", j === i));
  showGame();
}
const RR_INDEX = Object.fromEntries(DATA.railroads.map((r, i) => [r.id, i]));
for (const t of trackEls) t.rr = RR_INDEX[t.lines[0].dataset.rr];
$("gPick").innerHTML = GAMES.map(g => `<button>${g.players.length} players</button>`).join("");
document.querySelectorAll("#gPick button").forEach((b, i) => b.onclick = () => pickGame(i));
$("gPlay").onclick = () => gPlaying ? (pauseGame(), showGame()) : playGame();
$("gStep").onclick = () => { pauseGame(); const run = gRun; advance(true, run).then(showGame); };
$("gBack").onclick = () => seekGame(gPos - 1);
$("gRestart").onclick = () => seekGame(0);
$("gSeek").oninput = e => seekGame(+e.target.value);
document.querySelectorAll("#gSpeed button").forEach(b => b.onclick = () => {
  gSpeed = +b.dataset.speed;
  document.querySelectorAll("#gSpeed button").forEach(x => x.classList.toggle("on", x === b));
});
document.querySelectorAll("#gPaint button").forEach(b => b.onclick = () => {
  gPaint = b.dataset.paint;
  document.querySelectorAll("#gPaint button").forEach(x => x.classList.toggle("on", x === b));
  drawPlay();
});
if (GAMES.length) pickGame(0); else drawGamePanel();
document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => { if (b.dataset.pane !== "paneGame") pauseGame(); showGame(); }));
if (DATA.open_tab) { showPane(DATA.open_tab); showGame(); }
// map.html#game=1&turn=40 opens the second recorded game at turn 40.
for (const link of LINKS) {
  const m = /^(game|turn)(?:=(\d+))?$/.exec(link);
  if (!m || !GAMES.length) continue;
  showPane("paneGame");
  if (m[1] === "game") pickGame(Math.min(GAMES.length - 1, +(m[2] || 0))); else seekGame(+(m[2] || 0));
}
if (LINKS.includes("play") && GAMES.length) { showPane("paneGame"); playGame(); }   // map.html#play

// ---------------------------------------------------------- layout switch
const HINTS = {
  geo: document.getElementById("hint").textContent,
  even: "Even spacing: every piece of track is about the same length, so distance on screen is distance in moves.",
};
let layout = "geo", morph = 0;
function setLayout(name, ms = 700) {
  if (name === layout) return;
  layout = name;
  document.querySelectorAll("#layout button").forEach(b => b.classList.toggle("on", b.dataset.layout === name));
  document.getElementById("hint").textContent = HINTS[name];
  const from = {}, to = LAYOUTS[name];
  for (const id in P) from[id] = { x: P[id].x, y: P[id].y };
  const v0 = { ...view }, v1 = homeFor(to), run = ++morph, t0 = performance.now();
  gLabels.style.opacity = 0;
  const step = now => {
    if (run !== morph) return;              // a newer switch took over
    const t = ms ? Math.min(1, (now - t0) / ms) : 1, k = t * t * (3 - 2 * t);
    for (const id in P) {
      P[id].x = from[id].x + (to[id].x - from[id].x) * k;
      P[id].y = from[id].y + (to[id].y - from[id].y) * k;
    }
    for (const key of "xywh") view[key] = v0[key] + (v1[key] - v0[key]) * k;
    updateGeometry(); applyView(); drawGame(); drawPlay();
    if (t < 1) return requestAnimationFrame(step);
    HOME = v1;
    placeLabels();
    gLabels.style.opacity = 1;
    focus(hoverRR || pinned);
  };
  step(t0);
}
document.querySelectorAll("#layout button").forEach(b => b.onclick = () => setLayout(b.dataset.layout));
if (LINKS.includes("even")) setLayout("even", 0);   // map.html#even
</script>
